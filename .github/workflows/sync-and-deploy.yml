name: Sync from Notion & Deploy

# Khi nào trigger workflow này?
on:
  # 1. Mỗi giờ tự động chạy
  schedule:
    - cron: '*/15 * * * *'  # Mỗi 15 phút
  
  # 2. Khi push code lên main
  push:
    branches:
      - main
  
  # 3. Trigger thủ công từ GitHub UI
  workflow_dispatch:
    inputs:
      reason:
        description: 'Lý do trigger thủ công'
        required: false
        default: 'Manual sync'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🌿 Sync from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_POEMS_DB_ID: ${{ secrets.NOTION_POEMS_DB_ID }}
          NOTION_COLLECTIONS_DB_ID: ${{ secrets.NOTION_COLLECTIONS_DB_ID }}
          NOTION_AUTHOR_DB_ID: ${{ secrets.NOTION_AUTHOR_DB_ID }}
        run: npm run sync
      
      - name: 🎨 Build HTML pages
        run: npm run build
      
      - name: 📊 Show build stats
        run: |
          echo "=== Build Output ==="
          ls -la public/
          echo "=== Data files ==="
          ls -la data/
          echo "=== Total size ==="
          du -sh public/
      
      - name: ☁️ Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=minhdan-poetry-site --branch=main