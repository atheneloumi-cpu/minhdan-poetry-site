<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} — Minh Đan</title>
  <link rel="stylesheet" href="/styles/shared.css">
</head>
<body>
  <header>
    <h1><a href="/">Minh Đan</a></h1>
    <nav>
      <a href="/">Trang chủ</a>
      <a href="/library.html">Thư viện</a>
    </nav>
  </header>

  <main class="poem-page">
    <article>
      <h2 class="poem-title">{{title}}</h2>
      <p class="poem-meta">
        <span class="collection">{{collection}}</span>
        <span class="date">{{date}}</span>
      </p>
      <div class="poem-content">{{content}}</div>
      <div class="poem-tags">{{tags}}</div>
    </article>

    <a class="back-link" href="/library.html">← Về thư viện</a>
  </main>

  <footer>
    <p>© Minh Đan</p>
  </footer>
</body>
</html>
